<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gourmet Studio · Advanced Menu Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --amber:#d97706;--amber-dark:#b45309;--amber-light:#fffbeb;
  --dark:#1c1917;--g900:#292524;--g700:#57534e;--g500:#a8a29e;
  --g300:#d6d3d1;--g200:#e7e5e4;--g100:#f5f5f4;--white:#fff;
  --green:#16a34a;--red:#dc2626;--blue:#2563eb;--purple:#7c3aed;
  --sh-sm:0 1px 2px rgba(0,0,0,.05);
  --sh:0 4px 16px rgba(0,0,0,.06);
  --sh-lg:0 24px 48px -16px rgba(0,0,0,.16);
  --r:12px;--r-lg:20px;--r-full:999px;
  --accent:#d97706;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--g100);color:var(--g900);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:1rem;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--g300);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--g500)}

/* ============ HEADER ============ */
.app-header{background:var(--white);border-bottom:1px solid var(--g200);position:sticky;top:0;z-index:100}
.app-header-inner{max-width:1320px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:22px;height:66px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem;letter-spacing:-.4px;color:var(--dark);flex-shrink:0}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--amber),#f59e0b);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.1rem;box-shadow:0 6px 14px -4px rgba(217,119,6,.5)}
.tabs{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 15px;border-radius:10px;font-size:.83rem;font-weight:600;color:var(--g700);display:flex;align-items:center;gap:7px;white-space:nowrap;transition:.15s}
.tab:hover{background:var(--g100);color:var(--dark)}
.tab.active{background:var(--dark);color:#fff}
.header-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}

.btn{padding:10px 17px;border-radius:10px;font-weight:600;font-size:.85rem;display:inline-flex;align-items:center;gap:8px;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--dark);color:#fff}
.btn-primary:hover{background:#000;transform:translateY(-1px)}
.btn-amber{background:var(--amber);color:#fff;box-shadow:0 6px 14px -4px rgba(217,119,6,.5)}
.btn-amber:hover{background:var(--amber-dark)}
.btn-ghost{background:var(--g100);color:var(--g900)}
.btn-ghost:hover{background:var(--g200)}
.btn-outline{background:#fff;border:1.5px solid var(--g200);color:var(--g900)}
.btn-outline:hover{border-color:var(--amber);color:var(--amber)}
.btn-danger{background:#fef2f2;color:var(--red)}
.btn-danger:hover{background:#fee2e2}
.btn-sm{padding:7px 12px;font-size:.78rem;border-radius:8px}
.btn-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--g100);color:var(--g700);transition:.15s}
.btn-icon:hover{background:var(--g200);color:var(--dark)}
.btn-block{width:100%;justify-content:center}

/* ============ LAYOUT ============ */
.wrap{max-width:1320px;margin:0 auto;padding:26px 22px 80px}
.view{display:none;animation:fade .3s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.page-head{margin-bottom:22px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head h1{font-size:1.65rem;font-weight:800;letter-spacing:-.7px;color:var(--dark)}
.page-head p{color:var(--g700);font-size:.9rem;margin-top:3px}

.card{background:#fff;border-radius:var(--r-lg);border:1px solid var(--g200);box-shadow:var(--sh-sm)}
.card-pad{padding:22px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 20px;border-bottom:1px solid var(--g200);flex-wrap:wrap}
.card-head h3{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:9px}
.card-head h3 i{color:var(--amber)}

/* ============ DASHBOARD ============ */
.dash-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:start}
@media(max-width:1000px){.dash-grid{grid-template-columns:1fr}}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media(max-width:700px){.stat-row{grid-template-columns:1fr 1fr}}
.stat{background:#fff;border:1px solid var(--g200);border-radius:var(--r-lg);padding:16px 18px}
.stat .lbl{font-size:.72rem;font-weight:600;color:var(--g500);text-transform:uppercase;letter-spacing:.5px}
.stat .val{font-size:1.6rem;font-weight:800;color:var(--dark);letter-spacing:-.6px;margin-top:4px;line-height:1.1}
.stat .sub{font-size:.75rem;color:var(--green);font-weight:600;margin-top:3px}
.stat .sub.warn{color:var(--amber)}

.qr-panel{display:flex;flex-direction:column;align-items:center;padding:26px 20px;text-align:center}
.qr-frame{background:#fff;border:1px solid var(--g200);border-radius:var(--r);padding:14px;box-shadow:var(--sh);position:relative}
.qr-frame::before,.qr-frame::after{content:'';position:absolute;width:24px;height:24px;border:3px solid var(--amber);border-radius:6px}
.qr-frame::before{top:-4px;left:-4px;border-right:none;border-bottom:none}
.qr-frame::after{bottom:-4px;right:-4px;border-left:none;border-top:none}
#qrcode{display:flex;align-items:center;justify-content:center;min-height:190px;min-width:190px}
#qrcode img,#qrcode canvas{border-radius:6px;display:block}
.qr-panel h3{font-size:1rem;font-weight:700;margin:16px 0 3px}
.qr-panel p{font-size:.82rem;color:var(--g700);margin-bottom:14px}
.qr-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

.quick-list{display:flex;flex-direction:column}
.quick-item{display:flex;align-items:center;gap:13px;padding:13px 20px;border-bottom:1px solid var(--g100);transition:.15s;cursor:pointer}
.quick-item:last-child{border-bottom:none}
.quick-item:hover{background:var(--g100)}
.quick-item .qi-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0;background:var(--amber-light);color:var(--amber)}
.quick-item .qi-info{flex:1;min-width:0}
.quick-item .qi-info strong{font-size:.88rem;display:block}
.quick-item .qi-info small{font-size:.77rem;color:var(--g500)}
.quick-item i.fa-chevron-right{color:var(--g300);font-size:.78rem}

/* ============ EDITOR ============ */
.editor-grid{display:grid;grid-template-columns:250px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.editor-grid{grid-template-columns:1fr}}
.cat-sidebar{background:#fff;border:1px solid var(--g200);border-radius:var(--r-lg);overflow:hidden;position:sticky;top:86px}
.cat-sidebar-head{padding:15px 17px;border-bottom:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between}
.cat-sidebar-head h3{font-size:.92rem;font-weight:700}
.cat-list{max-height:calc(100vh - 250px);overflow-y:auto}
.cat-row{display:flex;align-items:center;gap:10px;padding:11px 17px;cursor:pointer;transition:.15s;border-left:3px solid transparent}
.cat-row:hover{background:var(--g100)}
.cat-row.active{background:var(--amber-light);border-left-color:var(--amber)}
.cat-row .cr-emoji{font-size:1.2rem;width:24px;text-align:center}
.cat-row .cr-name{flex:1;font-size:.86rem;font-weight:600;color:var(--g900);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-row .cr-count{font-size:.7rem;color:var(--g500);background:var(--g100);padding:2px 7px;border-radius:var(--r-full);font-weight:700}
.cat-row.active .cr-count{background:#fff}
.cat-row .cr-del{opacity:0;color:var(--g500);font-size:.78rem;transition:.15s;padding:4px}
.cat-row:hover .cr-del{opacity:1}
.cat-row .cr-del:hover{color:var(--red)}

.items-area{min-width:0}
.items-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.items-head h2{font-size:1.25rem;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:9px}
.items-head h2 span{font-size:1.35rem}

.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:15px}
.item-card{background:#fff;border:1px solid var(--g200);border-radius:var(--r-lg);overflow:hidden;transition:.2s;position:relative;display:flex;flex-direction:column}
.item-card:hover{box-shadow:var(--sh);border-color:var(--g300)}
.item-card.unavailable{opacity:.55}
.item-thumb{width:100%;height:150px;background:linear-gradient(145deg,var(--amber-light),#fef3c7);display:flex;align-items:center;justify-content:center;font-size:3.6rem;position:relative;overflow:hidden}
.item-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.item-card-body{padding:14px 15px 15px;display:flex;flex-direction:column;flex:1}
.item-info h4{font-size:.95rem;font-weight:700;color:var(--dark);margin-bottom:3px;line-height:1.25}
.item-info .desc{font-size:.77rem;color:var(--g500);line-height:1.4;margin-bottom:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-info .price{font-size:1rem;font-weight:800;color:var(--amber-dark)}
.item-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:.64rem;font-weight:700;padding:3px 8px;border-radius:var(--r-full);text-transform:uppercase;letter-spacing:.3px}
.tag.veg{background:#dcfce7;color:#15803d}
.tag.spicy{background:#fee2e2;color:#b91c1c}
.tag.popular{background:#fef3c7;color:#b45309}
.tag.new{background:#dbeafe;color:#1d4ed8}
.tag.chef{background:#f3e8ff;color:#7e22ce}
.item-actions{position:absolute;top:10px;right:10px;display:flex;gap:4px;opacity:0;transition:.15s;z-index:2}
.item-card:hover .item-actions{opacity:1}
.item-actions .btn-icon{width:30px;height:30px;font-size:.72rem;background:rgba(255,255,255,.95);box-shadow:var(--sh-sm);border:1px solid var(--g200)}
.attach-badge{position:absolute;top:10px;left:10px;background:var(--dark);color:#fff;font-size:.62rem;font-weight:700;padding:3px 8px;border-radius:var(--r-full);display:flex;align-items:center;gap:4px;z-index:2}

.empty-box{text-align:center;padding:60px 24px;color:var(--g500)}
.empty-box i{font-size:2.6rem;color:var(--g300);margin-bottom:14px}
.empty-box h3{font-size:1.05rem;color:var(--g700);margin-bottom:6px}
.empty-box p{font-size:.86rem;margin-bottom:18px}

/* ============ DESIGN ============ */
.design-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:900px){.design-grid{grid-template-columns:1fr}}
.form-row{margin-bottom:16px}
.form-row label{display:block;font-size:.82rem;font-weight:700;margin-bottom:6px;color:var(--g900)}
.form-row .hint{font-size:.74rem;color:var(--g500);font-weight:400;margin-top:4px}
.input{width:100%;padding:10px 13px;border:1.5px solid var(--g200);border-radius:10px;outline:none;transition:.15s;font-size:.88rem;background:#fff}
.input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(217,119,6,.1)}
textarea.input{resize:vertical;min-height:70px}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.color-row{display:flex;gap:9px;flex-wrap:wrap}
.color-swatch{width:36px;height:36px;border-radius:10px;cursor:pointer;border:3px solid transparent;transition:.15s;position:relative}
.color-swatch:hover{transform:scale(1.08)}
.color-swatch.active{border-color:var(--dark);box-shadow:0 0 0 2px #fff inset}
.color-swatch.active::after{content:'\f00c';font-family:'Font Awesome 6 Free';font-weight:900;color:#fff;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.75rem;text-shadow:0 1px 3px rgba(0,0,0,.4)}

.emoji-picker{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.emoji-opt{width:36px;height:36px;border-radius:9px;background:var(--g100);display:flex;align-items:center;justify-content:center;font-size:1.15rem;cursor:pointer;transition:.15s;border:2px solid transparent}
.emoji-opt:hover{background:var(--g200)}
.emoji-opt.active{border-color:var(--amber);background:var(--amber-light)}

.switch{display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 13px;border:1.5px solid var(--g200);border-radius:11px;transition:.15s}
.switch:hover{border-color:var(--g300)}
.switch input{display:none}
.switch .track{width:38px;height:21px;background:var(--g300);border-radius:11px;position:relative;transition:.2s;flex-shrink:0}
.switch .track::after{content:'';position:absolute;width:17px;height:17px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked + .track{background:var(--green)}
.switch input:checked + .track::after{left:19px}
.switch .sw-label{font-size:.86rem;font-weight:600}

/* ============ PHONE PREVIEW ============ */
.preview-stage{display:flex;justify-content:center;padding:20px 0}
.phone{width:400px;max-width:100%;background:#000;border-radius:44px;padding:11px;box-shadow:0 40px 80px -20px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.05)}
.phone-screen{background:#fff;border-radius:35px;overflow:hidden;height:780px;display:flex;flex-direction:column;position:relative}
.phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:130px;height:26px;background:#000;border-radius:0 0 16px 16px;z-index:10}
.menu-scroll{flex:1;overflow-y:auto}
.menu-scroll::-webkit-scrollbar{width:0}

.menu-hero{padding:52px 22px 26px;text-align:center;position:relative;overflow:hidden}
.menu-hero::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,rgba(255,255,255,.25),transparent 60%);pointer-events:none}
.menu-hero .mh-logo{font-size:3rem;margin-bottom:10px;position:relative;z-index:1}
.menu-hero h1{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:800;color:#fff;letter-spacing:-.5px;position:relative;z-index:1;line-height:1.15}
.menu-hero p{color:rgba(255,255,255,.85);font-size:.84rem;margin-top:7px;position:relative;z-index:1}
.menu-hero .mh-meta{display:flex;gap:12px;justify-content:center;margin-top:16px;position:relative;z-index:1;flex-wrap:wrap}
.menu-hero .mh-meta span{color:rgba(255,255,255,.9);font-size:.72rem;font-weight:600;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.15);padding:5px 11px;border-radius:var(--r-full);backdrop-filter:blur(6px)}

.menu-nav{position:sticky;top:0;background:#fff;z-index:5;border-bottom:1px solid var(--g200);padding:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.menu-nav-scroll{display:flex;gap:6px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.menu-nav-scroll::-webkit-scrollbar{display:none}
.menu-nav-chip{padding:7px 13px;border-radius:var(--r-full);font-size:.77rem;font-weight:700;color:var(--g700);background:var(--g100);white-space:nowrap;transition:.15s;flex-shrink:0}
.menu-nav-chip.active{background:var(--accent);color:#fff}

.menu-cat{padding:22px 18px 8px}
.menu-cat-head{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.menu-cat-head .mc-emoji{font-size:1.3rem}
.menu-cat-head h2{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;color:var(--dark);letter-spacing:-.3px}
.menu-cat-head .mc-line{flex:1;height:1px;background:var(--g200)}

.menu-item{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--g100);position:relative}
.menu-item:last-child{border-bottom:none}
.menu-item .mi-img{width:70px;height:70px;border-radius:13px;background:var(--g100);display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0;overflow:hidden}
.menu-item .mi-img img{width:100%;height:100%;object-fit:cover}
.menu-item .mi-body{flex:1;min-width:0}
.menu-item .mi-top{display:flex;align-items:baseline;gap:8px}
.menu-item .mi-name{font-size:.92rem;font-weight:700;color:var(--dark);line-height:1.25}
.menu-item .mi-dots{flex:1;border-bottom:2px dotted var(--g300);margin:0 2px;position:relative;top:-3px}
.menu-item .mi-price{font-size:.95rem;font-weight:800;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.menu-item .mi-desc{font-size:.77rem;color:var(--g500);line-height:1.45;margin-top:4px}
.menu-item .mi-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.menu-item .mi-attach{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.menu-item .mi-attach a{font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:var(--r-full);display:inline-flex;align-items:center;gap:5px;text-decoration:none;transition:.15s}
.menu-item .mi-attach a.pdf{background:#fef2f2;color:#b91c1c}
.menu-item .mi-attach a.pdf:hover{background:#fee2e2}
.menu-item .mi-attach a.img{background:#eff6ff;color:#1d4ed8}
.menu-item .mi-attach a.img:hover{background:#dbeafe}
.menu-item.unavailable{opacity:.45}
.menu-item.unavailable .mi-name::after{content:' · Sold out';font-size:.7rem;color:var(--red);font-weight:700}

.menu-footer{padding:26px 18px 34px;text-align:center;border-top:1px solid var(--g100);margin-top:16px}
.menu-footer .mf-logo{font-size:1.8rem;margin-bottom:8px}
.menu-footer p{font-size:.76rem;color:var(--g500);line-height:1.6}
.menu-footer .mf-social{display:flex;gap:10px;justify-content:center;margin-top:14px}
.menu-footer .mf-social span{width:34px;height:34px;border-radius:50%;background:var(--g100);display:flex;align-items:center;justify-content:center;color:var(--g700);font-size:.85rem}

/* ============ MENU PDF CARDS ============ */
.menu-pdfs{padding:22px 18px}
.menu-pdfs h3{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;color:var(--dark);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.pdf-card{display:flex;align-items:center;gap:13px;padding:13px 14px;background:var(--g100);border-radius:14px;margin-bottom:9px;text-decoration:none;color:inherit;transition:.15s}
.pdf-card:hover{background:#e7e5e4;transform:translateY(-1px)}
.pdf-card .pdf-icon{width:42px;height:42px;border-radius:11px;background:#fef2f2;color:var(--red);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.pdf-card .pdf-info{flex:1;min-width:0}
.pdf-card .pdf-info strong{font-size:.86rem;display:block;color:var(--dark)}
.pdf-card .pdf-info small{font-size:.73rem;color:var(--g500)}
.pdf-card > i{color:var(--g500);font-size:.85rem}

/* ============ UPLOAD ZONES ============ */
.upload-zone{border:2px dashed var(--g300);border-radius:14px;padding:22px 16px;text-align:center;cursor:pointer;transition:.2s;background:var(--g100)}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--amber);background:var(--amber-light)}
.upload-zone i{font-size:1.8rem;color:var(--amber);margin-bottom:8px;display:block}
.upload-zone strong{display:block;font-size:.88rem;margin-bottom:3px;color:var(--dark)}
.upload-zone small{font-size:.75rem;color:var(--g500)}
.upload-zone input{display:none}

.preview-thumb{display:flex;align-items:center;gap:11px;padding:11px;background:var(--g100);border-radius:12px;margin-top:10px}
.preview-thumb .pt-img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--g200);flex-shrink:0}
.preview-thumb .pt-icon{width:56px;height:56px;border-radius:10px;background:#fef2f2;color:var(--red);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
.preview-thumb .pt-info{flex:1;min-width:0}
.preview-thumb .pt-info strong{font-size:.82rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-thumb .pt-info small{font-size:.72rem;color:var(--g500)}
.preview-thumb .pt-del{color:var(--red);font-size:.85rem;padding:6px}

/* ============ MODAL ============ */
.overlay{position:fixed;inset:0;background:rgba(28,25,23,.55);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:.25s;z-index:200}
.overlay.show{opacity:1;visibility:visible}
.modal{position:fixed;inset:0;z-index:201;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:.25s;pointer-events:none}
.modal.show{opacity:1;visibility:visible;pointer-events:auto}
.modal-card{background:#fff;border-radius:var(--r-lg);width:100%;max-width:620px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--sh-lg);transform:scale(.96) translateY(10px);transition:.25s cubic-bezier(.34,1.4,.64,1)}
.modal.show .modal-card{transform:scale(1) translateY(0)}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-head h3{font-size:1.08rem;font-weight:800;letter-spacing:-.3px}
.modal-body{padding:20px 22px;overflow-y:auto;flex:1}
.modal-foot{padding:15px 22px;border-top:1px solid var(--g200);display:flex;gap:10px;justify-content:flex-end;flex-shrink:0;background:var(--g100);border-radius:0 0 var(--r-lg) var(--r-lg)}

.tabs-inner{display:flex;gap:4px;background:var(--g100);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs-inner button{flex:1;padding:9px 10px;border-radius:9px;font-size:.82rem;font-weight:700;color:var(--g700);transition:.15s}
.tabs-inner button.active{background:#fff;color:var(--dark);box-shadow:var(--sh-sm)}
.attach-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}

/* ============ TOAST ============ */
.toasts{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none}
.toast{background:var(--dark);color:#fff;padding:12px 20px;border-radius:var(--r-full);font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:9px;box-shadow:var(--sh-lg);animation:tIn .3s cubic-bezier(.34,1.5,.64,1);white-space:nowrap;max-width:90vw}
.toast i{color:#4ade80}
.toast.err i{color:#f87171}
@keyframes tIn{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}

/* ============ CUSTOMER VIEW ============ */
#customerView{display:none}
#customerView.active{display:block}
body.customer-mode{background:#fafaf9}
body.customer-mode .app-header,body.customer-mode .wrap{display:none}
#customerView .cv-phone{max-width:520px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 60px rgba(0,0,0,.08)}
@media(min-width:521px){#customerView{padding:24px 0}#customerView .cv-phone{border-radius:0;min-height:auto}}

@media(max-width:700px){
  .app-header-inner{gap:12px;padding:0 14px;height:60px}
  .brand span{display:none}
  .header-actions .btn span{display:none}
  .wrap{padding:18px 14px 70px}
  .qr-panel{padding:22px 16px}
  .phone{width:100%;border-radius:32px;padding:8px}
  .phone-screen{height:680px;border-radius:26px}
  .stat-row{grid-template-columns:1fr 1fr}
}
